<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown to March 11, 2030</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --accent: #ff3b3b;
      --accent2: #ff7a5a;
      --text: #e8e8e0;
      --muted: #555566;
      --border: #1e1e2e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Glow orb */
    body::after {
      content: '';
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,59,59,0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      max-width: 900px;
      width: 100%;
    }

    .label-top {
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .label-top span {
      color: var(--accent2);
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 7rem);
      letter-spacing: 0.05em;
      color: var(--text);
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    h1 span {
      color: var(--accent);
    }

    .target-date {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 3.5rem;
    }

    /* Countdown grid */
    .countdown {
      display: flex;
      justify-content: center;
      gap: clamp(0.5rem, 3vw, 2rem);
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .digits {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3.5rem, 12vw, 8rem);
      line-height: 1;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.2em 0.4em;
      min-width: 2ch;
      letter-spacing: 0.04em;
      position: relative;
      transition: color 0.1s;
    }

    .digits::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      height: 1px;
      background: var(--border);
    }

    .unit:first-child .digits {
      color: var(--accent);
      border-color: rgba(255,59,59,0.3);
      box-shadow: 0 0 30px rgba(255,59,59,0.08), inset 0 0 20px rgba(255,59,59,0.04);
    }

    .unit-label {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sep {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      color: var(--muted);
      align-self: center;
      padding-bottom: 0.4em;
      opacity: 0.4;
    }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 2.5rem;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .progress-bar {
      height: 2px;
      background: var(--border);
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width 1s linear;
    }

    /* Live indicator */
    .live {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* Finished state */
    .finished {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 12vw, 8rem);
      color: var(--accent);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="label-top">counting down to <span>march 11, 2030 · 12:00</span></p>
    <h1>TIME <span>REMAINING</span></h1>
    <p class="target-date">03 · 11 · 2030 — 12:00:00</p>

    <div class="countdown" id="countdown">
      <div class="unit">
        <div class="digits" id="days">000</div>
        <div class="unit-label">days</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="digits" id="hours">00</div>
        <div class="unit-label">hours</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="digits" id="minutes">00</div>
        <div class="unit-label">minutes</div>
      </div>
      <div class="sep">:</div>
      <div class="unit">
        <div class="digits" id="seconds">00</div>
        <div class="unit-label">seconds</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="elapsed-label">mar 11 2026 ——————— mar 11 2030</span>
        <span id="pct-label">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
    </div>

    <div class="live"><div class="dot"></div> live countdown</div>
  </div>

  <script>
    const TARGET = new Date('2030-03-11T12:00:00').getTime();
    const START  = new Date('2026-03-11T12:00:00').getTime(); // start of residential period

    const pad = (n, w = 2) => String(Math.floor(n)).padStart(w, '0');

    function tick() {
      const now  = Date.now();
      const diff = TARGET - now;

      if (diff <= 0) {
        document.getElementById('countdown').innerHTML =
          '<div class="finished">We\'ve arrived!</div>';
        return;
      }

      const days    = diff / 86400000;
      const hours   = (diff % 86400000) / 3600000;
      const minutes = (diff % 3600000)  / 60000;
      const seconds = (diff % 60000)    / 1000;

      document.getElementById('days').textContent    = pad(days, 3);
      document.getElementById('hours').textContent   = pad(hours);
      document.getElementById('minutes').textContent = pad(minutes);
      document.getElementById('seconds').textContent = pad(seconds);

      // Progress bar
      const totalSpan = TARGET - START;
      const elapsed   = now - START;
      const pct       = Math.min(100, Math.max(0, (elapsed / totalSpan) * 100));
      document.getElementById('progress-fill').style.width = pct.toFixed(4) + '%';
      document.getElementById('pct-label').textContent = pct.toFixed(2) + '%';
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
